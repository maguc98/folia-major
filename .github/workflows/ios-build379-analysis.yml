name: Analyze Folia iOS Build 379 Payload

on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: "Direct HTTPS download URL for Folia-iOS-3.0.6-build379-public-sanitized-v2.zip (sanitized public payload only)"
        required: true
        type: string
      expected_sha256:
        description: "Expected SHA-256 of the sanitized ZIP"
        required: true
        default: "f8e08042914a01f63f8aabbadd9f61cca32dd92fd45cfe194495f1e40acbab32"
        type: string

permissions:
  contents: read

concurrency:
  group: folia-ios-build379-analysis
  cancel-in-progress: false

jobs:
  analyze:
    name: Inspect sanitized iOS payload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out analysis scripts
        uses: actions/checkout@v4
        with:
          ref: ios-build379-baseline

      - name: Run native bridge contract fixture tests
        run: |
          python3 -m unittest discover -s tests -p 'test_native_bridge_build379.py' -v

      - name: Set up Node.js for bridge adapter tests
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test bridge compatibility adapter
        run: node --test tests/*.test.js

      - name: Download sanitized payload
        env:
          ARTIFACT_URL: ${{ inputs.artifact_url }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          set -euo pipefail
          case "$ARTIFACT_URL" in
            https://*) ;;
            *) echo "::error::Only HTTPS download URLs are accepted."; exit 1 ;;
          esac
          curl --fail --location --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o /tmp/folia-payload.zip
          echo "$EXPECTED_SHA256  /tmp/folia-payload.zip" | sha256sum --check -

      - name: Verify sanitized payload integrity and safety
        run: |
          python3 tools/ios-build379/verify_payload.py /tmp/folia-payload.zip

      - name: Analyze archive and front-end resources
        run: |
          python3 tools/ios-build379/analyze_payload.py /tmp/folia-payload.zip --output analysis-output

      - name: Upload analysis report
        uses: actions/upload-artifact@v4
        with:
          name: folia-ios-build379-analysis
          path: analysis-output/
          if-no-files-found: error
          retention-days: 30
