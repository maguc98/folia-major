name: Deploy QQ Music API to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - ios/esign-ipa
    paths:
      - 'worker/qq-api-only.ts'
      - 'worker/qq.ts'
      - 'worker/qqQrChannel.ts'
      - 'wrangler.qq-api.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-qq-api-cloudflare.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: folia-qq-api-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy QQ API and build iOS IPA
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ios/esign-ipa

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Deploy Cloudflare Worker and upload QQ session secret
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.qq-api.jsonc
          secrets: |
            QQ_SESSION_SECRET
        env:
          QQ_SESSION_SECRET: ${{ secrets.QQ_SESSION_SECRET }}

      - name: Resolve public QQ API URL
        id: endpoint
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")"
          subdomain="$(jq -r '.result.subdomain // empty' <<< "$response")"
          if [[ -z "$subdomain" ]]; then
            echo "::error::This Cloudflare account has no workers.dev subdomain. Enable one in Workers & Pages, then rerun this workflow."
            exit 1
          fi
          api_base="https://folia-qq-api-ios.${subdomain}.workers.dev/api/qq"
          echo "qq_api_base=$api_base" >> "$GITHUB_OUTPUT"
          {
            echo "### QQ Music backend deployed"
            echo
            echo "- API base: $api_base"
            echo "- QQ and WeChat QR channels are enabled through the Durable Object binding."
            echo
            echo "The iOS IPA build will now be triggered with this backend address."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger iOS IPA build with the deployed API
        env:
          GH_TOKEN: ${{ github.token }}
          QQ_API_BASE: ${{ steps.endpoint.outputs.qq_api_base }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run ios-esign-ipa.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref ios/esign-ipa \
            -f "qq_api_base=$QQ_API_BASE"
          echo "Triggered iOS IPA build with the deployed QQ API." >> "$GITHUB_STEP_SUMMARY"
