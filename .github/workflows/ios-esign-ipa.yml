name: Build Folia iOS IPA (eSign)

on:
  workflow_dispatch:
    inputs:
      qq_api_base:
        description: 'External QQ Music API base URL (leave blank when deploying Cloudflare below)'
        required: false
        type: string
  push:
    branches:
      - ios/esign-ipa
    paths:
      - 'src/**'
      - 'public/**'
      - 'api-ts/**'
      - 'vite.config.ts'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/ios-esign-ipa.yml'

permissions:
  contents: read

concurrency:
  group: folia-ios-esign-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned iOS app
    runs-on: macos-15-intel
    env:
      # Account IDs identify an account; they are not authentication credentials.
      CLOUDFLARE_ACCOUNT_ID: "e69714b233771b5e9578abb62b75daa1"
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Validate Cloudflare deployment secrets
        if: ${{ vars.DEPLOY_QQ_API == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Missing GitHub Actions repository secret: CLOUDFLARE_API_TOKEN"
            echo "Add it under Settings → Secrets and variables → Actions, then rerun with Cloudflare deployment enabled."
            exit 1
          fi

      - name: Create Cloudflare QQ API Worker and Durable Object
        if: ${{ vars.DEPLOY_QQ_API == 'true' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.qq-api.jsonc

      - name: Create persistent QQ session secret if missing
        if: ${{ vars.DEPLOY_QQ_API == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/folia-qq-api-ios/secrets"
          existing="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "$endpoint")"

          if jq -e '((.result // []) | any(.name == "QQ_SESSION_SECRET"))' <<< "$existing" >/dev/null; then
            echo "QQ_SESSION_SECRET already exists; keeping the existing key."
          else
            echo "No QQ_SESSION_SECRET found. Creating a persistent random key in Cloudflare."
            secret="$(openssl rand -hex 32)"
            payload="$(jq -n --arg text "$secret" '{name:"QQ_SESSION_SECRET",type:"secret_text",text:$text}')"
            unset secret
            created="$(curl --fail --silent --show-error \
              -X PUT \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "$endpoint")"
            unset payload
            jq -e '.success == true' <<< "$created" >/dev/null
            echo "Persistent QQ_SESSION_SECRET created in Cloudflare Worker Secrets."
          fi

      - name: Resolve and verify Cloudflare QQ API URL
        id: qq_api_endpoint
        if: ${{ vars.DEPLOY_QQ_API == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")"
          subdomain="$(jq -r '.result.subdomain // empty' <<< "$response")"
          if [[ -z "$subdomain" ]]; then
            echo "::error::This Cloudflare account has no workers.dev subdomain. Enable one in Workers & Pages, then rerun."
            exit 1
          fi

          api_base="https://folia-qq-api-ios.${subdomain}.workers.dev/api/qq"
          channels="$(curl --fail --silent --show-error --retry 8 --retry-delay 2 --retry-all-errors \
            "$api_base/login/channels")"
          if ! jq -e '((.data.channels // .channels // []) | index("qq")) != null and ((.data.channels // .channels // []) | index("wechat")) != null' <<< "$channels" >/dev/null; then
            echo "::error::QQ API deployed, but both QQ and WeChat login channels were not confirmed."
            echo "$channels"
            exit 1
          fi

          echo "api_base=$api_base" >> "$GITHUB_OUTPUT"
          {
            echo "### QQ Music backend ready"
            echo
            echo "- API base: $api_base"
            echo "- Login channels verified: QQ and WeChat"
            echo "- The iOS build is using this endpoint."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install temporary Capacitor toolchain
        run: npm install --no-save --no-package-lock @capacitor/core@8.4.2 @capacitor/ios@8.4.2 @capacitor/cli@8.4.2

      - name: Build Folia web assets for Capacitor
        env:
          FOLIA_BUILD_TARGET: capacitor
          VITE_QQ_API_BASE: ${{ steps.qq_api_endpoint.outputs.api_base || inputs.qq_api_base || vars.VITE_QQ_API_BASE || '' }}
        run: npm run build

      - name: Generate and sync iOS project
        run: |
          set -euo pipefail
          npx cap add ios
          npx cap sync ios

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/ios-xcodebuild.log

      - name: Package unsigned IPA for eSign
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/ios-derived/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH"
          STAGING="build/unsigned-ipa"
          rm -rf "$STAGING" Folia-iOS-unsigned.ipa
          mkdir -p "$STAGING/Payload"
          ditto "$APP_PATH" "$STAGING/Payload/Folia.app"
          (
            cd "$STAGING"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/Folia-iOS-unsigned.ipa" Payload
          )
          unzip -l Folia-iOS-unsigned.ipa | head -n 25
          test -s Folia-iOS-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: Folia-iOS-unsigned-${{ github.run_number }}
          path: Folia-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xcode build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Folia-iOS-xcode-log-${{ github.run_number }}
          path: build/ios-xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

# Re-trigger after switching to the Intel macOS runner.
